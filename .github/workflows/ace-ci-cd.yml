name: ACE CI/CD Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build BAR file
        run: |
          mqsipackagebar -a FileProcessingApp.bar -k FileProcessingApp

      - name: Login to OpenShift
        run: |
          oc login --token=${{ secrets.OPENSHIFT_TOKEN }} --server=${{ secrets.OPENSHIFT_SERVER }} --insecure-skip-tls-verify

      - name: Create namespace if not exists
        run: |
          oc get ns ace-devops || oc create ns ace-devops

      - name: Apply manifests
        run: |
          oc apply -f openshift/deployment.yaml
          oc apply -f openshift/service.yaml
          oc apply -f openshift/route.yaml

      - name: Verify deployment
        run: |
          oc get pods -n ace-devops

