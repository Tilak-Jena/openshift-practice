name: OpenShift CRC Deploy

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: nginx:latest

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      # 1️⃣ Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Verify OpenShift access
      - name: Verify oc access
        run: |
          oc whoami
          oc project || true

      # 3️⃣ Trivy vulnerability scan (Week‑4 core task ✅)
      - name: Scan container image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}
          scanners: vuln
          severity: HIGH,CRITICAL
          timeout: 10m
          exit-code: 1

      # 4️⃣ Deploy to OpenShift (only runs if Trivy PASSES)
      - name: Deploy to OpenShift (CRC)
        run: |
          oc apply -f nginx-deploy-with-configmap.yaml
