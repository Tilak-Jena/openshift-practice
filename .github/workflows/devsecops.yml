name: DevSecOps Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  trivy-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible

      - name: Install Trivy (official script)
        run: |
          sudo apt-get update
          sudo apt-get install -y wget curl
          bash -c "$(curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh)"
          sudo mv .bin/trivy /usr/local/bin/trivy
          trivy --version

      - name: Build Docker image
        run: |
          docker build -t myapp:latest .

      - name: Run Trivy scan via Ansible
        run: |
          ansible-playbook scan-trivy.yml

      - name: Upload Trivy report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: reports/trivy-nginx-report.txt
